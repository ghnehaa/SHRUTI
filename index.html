<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHRUTI Care — Medical Management Suite</title>
<style>
:root{
  --primary:#0d9488; --primary-d:#0f766e; --primary-l:#ccfbf1;
  --accent:#2563eb; --accent-l:#dbeafe;
  --rose:#e11d48; --rose-l:#ffe4e6;
  --violet:#7c3aed; --violet-l:#ede9fe;
  --bg:#f4f7f9; --card:#ffffff; --text:#0f172a; --muted:#64748b;
  --border:#e2e8f0; --success:#16a34a; --success-l:#dcfce7;
  --warning:#d97706; --warning-l:#fef3c7; --danger:#dc2626; --danger-l:#fee2e2;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.05);
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI','Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--text)}

.app{display:flex;min-height:100vh}
.sidebar{width:264px;background:#fff;border-right:1px solid var(--border);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:50;transition:transform .25s}
.brand{display:flex;align-items:center;gap:12px;padding:20px 20px 16px}
.brand-logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 16px rgba(13,148,136,.35)}
.brand b{font-size:17px;letter-spacing:.3px}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:400}
.nav{flex:1;overflow-y:auto;padding:8px 12px}
.nav-group{color:#94a3b8;font-size:10.5px;text-transform:uppercase;letter-spacing:1px;padding:14px 12px 6px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#475569;font-weight:500;margin-bottom:2px;transition:.15s}
.nav-item:hover{background:#f1f5f9;color:var(--text)}
.nav-item.active{background:linear-gradient(135deg,var(--primary-l),#f0fdfa);color:var(--primary-d);font-weight:600}
.nav-item svg{flex-shrink:0}
.nav-item .pill{margin-left:auto;background:var(--rose);color:#fff;font-size:10px;font-weight:700;border-radius:20px;padding:2px 7px}
.sidebar-foot{padding:14px 20px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}

.main{flex:1;margin-left:264px;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 28px;height:64px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:40}
.topbar .menu-btn{display:none}
.search{flex:1;max-width:480px;position:relative}
.search input{width:100%;background:#f1f5f9;border:1px solid transparent;border-radius:10px;padding:9px 14px 9px 38px;outline:none;transition:.15s}
.search input:focus{background:#fff;border-color:var(--primary)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#94a3b8}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.icon-btn{width:40px;height:40px;border-radius:10px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;color:#475569;position:relative;transition:.15s}
.icon-btn:hover{background:#e2e8f0}
.icon-btn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;background:var(--rose);border-radius:50%;border:2px solid #fff}
.bell-pop{position:absolute;right:0;top:50px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 40px rgba(15,23,42,.15);width:340px;display:none;overflow:hidden}
.bell-pop.open{display:block}
.bell-pop h4{padding:14px 16px;border-bottom:1px solid var(--border);font-size:13px}
.bell-pop .item{padding:11px 16px;border-bottom:1px solid #f1f5f9;font-size:12.5px;display:flex;gap:10px}
.bell-pop .item:last-child{border:none}
.bell-pop .item b{display:block;font-size:12.5px}
.bell-pop .item span{color:var(--muted);font-size:11.5px}
.bell-pop .item .dotc{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.profile{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;cursor:pointer}
.profile:hover{background:#f1f5f9}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.profile .nm{font-weight:600;font-size:13px;line-height:1.2}
.profile .rl{font-size:11px;color:var(--muted)}

.content{padding:26px 28px 60px;max-width:1400px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{font-size:23px;font-weight:700;letter-spacing:-.3px}
.page-head p{color:var(--muted);font-size:13px;margin-top:3px}
.head-actions{display:flex;gap:10px;flex-wrap:wrap}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #f1f5f9;gap:12px;flex-wrap:wrap}
.card-head h3{font-size:15px;font-weight:600}
.card-head .sub{color:var(--muted);font-size:12px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1200px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.g4,.g3,.g2{grid-template-columns:1fr}}

.stat{display:flex;gap:14px;align-items:center;padding:18px 20px}
.stat .ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat .ic.teal{background:var(--primary-l);color:var(--primary-d)}
.stat .ic.blue{background:var(--accent-l);color:var(--accent)}
.stat .ic.rose{background:var(--rose-l);color:var(--rose)}
.stat .ic.violet{background:var(--violet-l);color:var(--violet)}
.stat .ic.amber{background:var(--warning-l);color:var(--warning)}
.stat .v{font-size:23px;font-weight:700;line-height:1.1}
.stat .l{color:var(--muted);font-size:12.5px;font-weight:500}
.stat .t{font-size:11px;color:var(--muted);margin-top:3px}

.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;font-weight:600;font-size:13px;transition:.15s;border:1px solid transparent}
.btn svg{flex-shrink:0}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(13,148,136,.28)}
.btn-primary:hover{background:var(--primary-d)}
.btn-accent{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.25)}
.btn-accent:hover{background:#1d4ed8}
.btn-rose{background:var(--rose);color:#fff}
.btn-rose:hover{background:#be123c}
.btn-outline{background:#fff;border-color:var(--border);color:#334155}
.btn-outline:hover{background:#f8fafc;border-color:#cbd5e1}
.btn-ghost{color:var(--muted)}
.btn-ghost:hover{background:#f1f5f9;color:var(--text)}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn-block{width:100%;justify-content:center}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;padding:12px 16px;border-bottom:1px solid var(--border);white-space:nowrap;background:#fafcfd}
tbody td{padding:12px 16px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tbody tr:hover{background:#f8fafc}
tbody tr:last-child td{border-bottom:none}
.tbl-actions{display:flex;gap:6px;justify-content:flex-end}
.ta{width:34px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#64748b;background:#f1f5f9}
.ta:hover{background:#e2e8f0;color:var(--text)}
.ta.danger:hover{background:var(--danger-l);color:var(--danger)}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge .bd{width:6px;height:6px;border-radius:50%;background:currentColor}
.bg-success{background:var(--success-l);color:var(--success)}
.bg-warning{background:var(--warning-l);color:var(--warning)}
.bg-danger{background:var(--danger-l);color:var(--danger)}
.bg-info{background:var(--accent-l);color:var(--accent)}
.bg-teal{background:var(--primary-l);color:var(--primary-d)}
.bg-neutral{background:#f1f5f9;color:#64748b}
.bg-violet{background:var(--violet-l);color:var(--violet)}

.patient-cell{display:flex;align-items:center;gap:11px}
.patient-cell .avatar{width:34px;height:34px;font-size:12px}
.patient-cell b{display:block;font-size:13px}
.patient-cell span{color:var(--muted);font-size:11.5px}

.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(2px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(15,23,42,.25);width:100%;max-width:640px;animation:pop .2s}
.modal.lg{max-width:860px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:16px}
.modal-body{padding:22px;max-height:70vh;overflow-y:auto}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
@keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.form-grid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px}
.field span{font-size:12px;font-weight:600;color:#334155}
.field .hint{font-size:11px;color:var(--muted);font-weight:400}
.field input,.field select,.field textarea{border:1px solid var(--border);border-radius:10px;padding:9px 12px;outline:none;transition:.15s;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(13,148,136,.12)}
.field input.ro{background:#f8fafc;color:#64748b}
.field.full{grid-column:1/-1}

.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:0 10px 30px rgba(15,23,42,.3);display:flex;align-items:center;gap:10px;animation:pop .2s}
.toast.green{background:var(--success)}
.toast.red{background:var(--danger)}

.chart-box{position:relative;height:260px}
.chart-box canvas{width:100%;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.tabs{display:flex;gap:4px;background:#f1f5f9;padding:4px;border-radius:10px;width:fit-content;margin-bottom:18px}
.tab{padding:7px 15px;border-radius:8px;font-weight:600;font-size:12.5px;color:var(--muted)}
.tab.active{background:#fff;color:var(--primary-d);box-shadow:0 1px 4px rgba(15,23,42,.1)}

.progress{height:8px;background:#f1f5f9;border-radius:8px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#14b8a6);border-radius:8px}

.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:#e2e8f0}
.tl-item{position:relative;padding:0 0 18px 14px}
.tl-item::before{content:'';position:absolute;left:-22px;top:5px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--primary)}
.tl-item.done::before{border-color:var(--success)}
.tl-item.up::before{border-color:var(--warning)}
.tl-item b{font-size:13px}
.tl-item p{color:var(--muted);font-size:12px;margin-top:2px}

.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty svg{opacity:.35;margin-bottom:10px}
.empty p{font-size:13.5px}

.alert{display:flex;gap:12px;padding:13px 16px;border-radius:12px;font-size:13px;align-items:flex-start}
.alert.info{background:var(--accent-l);color:#1e3a8a}
.alert.warn{background:var(--warning-l);color:#78350f}
.alert.rose{background:var(--rose-l);color:#881337}
.alert.teal{background:var(--primary-l);color:#134e4a}
.alert b{display:block}

.risk-tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.kpi{text-align:center;padding:16px}
.kpi .n{font-size:26px;font-weight:700}
.kpi .k{font-size:11.5px;color:var(--muted);margin-top:2px}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:600;color:#475569}
.flow .fnode{background:var(--primary-l);color:var(--primary-d);padding:7px 12px;border-radius:9px}
.flow .fnode.warn{background:var(--warning-l);color:var(--warning)}
.flow .arrow{color:#94a3b8}
.otp-progress{display:flex;gap:6px}
.otp-seg{height:7px;flex:1;border-radius:6px;background:#e2e8f0}
.otp-seg.on{background:var(--primary)}
.otp-seg.warn{background:var(--warning)}
.otp-seg.bad{background:var(--danger)}
.print-hide{display:contents}
@media print{.sidebar,.topbar,.head-actions,.tbl-actions{display:none!important}.main{margin:0}.content{padding:0}}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:0 0 0 100vmax rgba(15,23,42,.4)}
  .main{margin-left:0}
  .topbar .menu-btn{display:flex}
  .content{padding:18px 16px 60px}
  .profile .nm,.profile .rl{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      </div>
      <div><b>SHRUTI Care</b><small>Medical Management Suite</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">SIH 2026 · MedTech/HealthTech<br>v2.0 — AI-Assisted Screening<br><span id="wsStatus" style="color:var(--warning)">Connecting...</span></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" onclick="toggleSidebar()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="globalSearch" placeholder="Search patients, records, medicines…" oninput="globalSearch(this.value)">
      </div>
      <div class="top-actions">
        <div style="position:relative">
          <button class="icon-btn" onclick="toggleBell()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="dot" id="bellDot"></span>
          </button>
          <div class="bell-pop" id="bellPop"></div>
        </div>
        <button class="icon-btn" onclick="printReport()" title="Print">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        </button>
        <div class="profile">
          <div class="avatar">DR</div>
          <div><div class="nm">Dr. Riya Verma</div><div class="rl">Chief Medical Officer</div></div>
        </div>
      </div>
    </header>

    <div class="content" id="content"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox"></div>
</div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ============================= ICONS ============================= */
const I={
  dash:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>',
  users:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  ear:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8.5a6 6 0 1 1 12 0c0 2.5-1.5 4-3 5.5-1.2 1.2-1.5 2-1.5 3.5"/><circle cx="10" cy="15" r="1"/><path d="M6 15v1a6 6 0 0 0 12 0v-1"/></svg>',
  baby:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4" r="2"/><path d="M12 6v5"/><path d="M12 11 6.5 15"/><path d="M12 11l5.5 4"/><path d="M6.5 15a5.5 5.5 0 0 0 11 0"/><path d="M4 19l-1 2"/><path d="M20 19l1 2"/></svg>',
  syringe:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 2 4 4"/><path d="m17 7 3-3"/><path d="M19 9 8.7 19.3a1 1 0 0 1-1.4 0L2 14l4-4 2.5 2.5"/><path d="m14 4 6 6"/><path d="m10 2 4 4"/><path d="m9 7 4 4"/></svg>',
  cal:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
  rx:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M4 6h16"/><path d="M12 2v4"/><path d="M8 6v5a3 3 0 0 0 6 0V6"/></svg>',
  lab:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v7.31"/><path d="M14 9.3V2"/><path d="M8.5 2h7"/><path d="M14 9.3a6.5 6.5 0 1 1-4 0"/><path d="M5.52 16h12.96"/></svg>',

const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtDate=s=>{if(!s)return'—';const [y,m,d]=s.split('-');return `${d}-${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]}-${y}`};
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const daysBetween=(a,b)=>{const x=new Date(a+'T12:00:00'),y=new Date(b+'T12:00:00');return Math.round((y-x)/86400000)};
const ageFromDob=dob=>{if(!dob)return'—';const b=new Date(dob),n=new Date();let y=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth();if(n.getDate()<b.getDate())m--;if(m<0){y--;m+=12}if(y===0&&m===0)return`${n.getDate()-b.getDate()||1}d`;if(y===0)return`${m}mo`;return`${y}y ${m}mo`};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0].toUpperCase()).join('');
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const fmtNo=n=>Number(n||0).toLocaleString('en-IN');
const colorFor=n=>{const c=['#0d9488','#2563eb','#e11d48','#7c3aed','#d97706','#0891b2','#16a34a','#db2777'];let h=0;for(const ch of String(n))h=(h*31+ch.charCodeAt(0))>>>0;return c[h%c.length]};
const monthsBack=n=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-n);return iso(d)};
const monthsAhead=n=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+n);return iso(d)};

/* ============================= CHARTS ============================= */
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this};
}
function prepCanvas(id){
  const c=document.getElementById(id);if(!c)return null;
  const dpr=window.devicePixelRatio||1;const r=c.getBoundingClientRect();
  c.width=r.width*dpr;c.height=r.height*dpr;c.style.width=r.width+'px';c.style.height=r.height+'px';
  const x=c.getContext('2d');x.scale(dpr,dpr);return{x,w:r.width,h:r.height,ctx:x};
}
function lineChart(id,labels,series,colors,names){
  const p=prepCanvas(id);if(!p)return;const{ctx,w,h}=p;
  const pad={l:42,r:12,t:14,b:28};
  const max=Math.max(4,...series.flat().map(v=>v*1.2));
  const min=0;
  const y=(v)=>h-pad.b-((v-min)/(max-min))*(h-pad.t-pad.b);
  const x=(i)=>pad.l+(i/(Math.max(1,labels.length-1)))*(w-pad.l-pad.r);
  ctx.font='10px Segoe UI';
  ctx.strokeStyle='#e2e8f0';ctx.fillStyle='#94a3b8';
  for(let g=0;g<=4;g++){const v=min+(max-min)*g/4;ctx.beginPath();ctx.moveTo(pad.l,y(v));ctx.lineTo(w-pad.r,y(v));ctx.stroke();ctx.fillText(Math.round(v),6,y(v)+3)}
  labels.forEach((l,i)=>{ctx.fillText(l,x(i)-6,h-pad.b+14)});
  series.forEach((s,si)=>{
    ctx.strokeStyle=colors[si][0];ctx.lineWidth=2.2;ctx.lineJoin='round';ctx.beginPath();
    s.forEach((v,i)=>{i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v))});ctx.stroke();
    const g=ctx.createLinearGradient(0,pad.t,0,h-pad.b);g.addColorStop(0,colors[si][0]+'26');g.addColorStop(1,colors[si][0]+'00');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x(0),h-pad.b);s.forEach((v,i)=>ctx.lineTo(x(i),y(v)));ctx.lineTo(x(s.length-1),h-pad.b);ctx.closePath();ctx.fill();
    ctx.fillStyle=colors[si][0];s.forEach((v,i)=>{ctx.beginPath();ctx.arc(x(i),y(v),3,0,7);ctx.fill()});
  });
}
function groupedBar(id,labels,series){
  const p=prepCanvas(id);if(!p)return;const{ctx,w,h}=p;
  const pad={l:36,r:10,t:14,b:26};
  const max=Math.max(3,...series.flatMap(s=>s.v))*1.15;
  const bw=Math.min(26,(w-pad.l-pad.r)/labels.length/1.7);
  ctx.font='10px Segoe UI';ctx.strokeStyle='#e2e8f0';ctx.fillStyle='#94a3b8';
  for(let g=0;g<=4;g++){const v=max*g/4,ys=h-pad.b-(v/max)*(h-pad.t-pad.b);ctx.beginPath();ctx.moveTo(pad.l,ys);ctx.lineTo(w-pad.r,ys);ctx.stroke();ctx.fillText(Math.round(v),4,ys+3)}
  labels.forEach((l,i)=>{
    ctx.fillStyle='#94a3b8';ctx.fillText(l,pad.l+(i+.5)*((w-pad.l-pad.r)/labels.length)-(bw*series.length/2),h-pad.b+14);
    series.forEach((s,si)=>{
      const x0=pad.l+(i+.5)*((w-pad.l-pad.r)/labels.length)-bw*series.length/2+si*bw;
      const hh=(s.v[i]/max)*(h-pad.t-pad.b);
      ctx.fillStyle=s.c;ctx.globalAlpha=.9;
      ctx.fillRect(x0+1,h-pad.b-hh,bw-2,hh);
      ctx.globalAlpha=1;
      ctx.fillStyle='#334155';ctx.fillText(s.v[i]||'',x0+bw/2-4,h-pad.b-hh-3);
    });
  });
}
function donut(id,data){
  const p=prepCanvas(id);if(!p)return;const{ctx,w,h}=p;
  const cx=w/2,cy=h/2,r=Math.min(w,h)/2-10,ir=r*.62;
  const total=data.reduce((s,d)=>s+d.v,0)||1;
  let a=-Math.PI/2;
  data.forEach(d=>{
    const a2=a+(d.v/total)*Math.PI*2;
    ctx.beginPath();ctx.arc(cx,cy,r,a,a2);ctx.arc(cx,cy,ir,a2,a,true);ctx.closePath();
    ctx.fillStyle=d.c;ctx.fill();
    a=a2;
  });
  ctx.fillStyle='#0f172a';ctx.font='700 15px Segoe UI';ctx.textAlign='center';
  ctx.fillText(total,cx,cy+4);
  ctx.font='10px Segoe UI';ctx.fillStyle='#94a3b8';ctx.fillText('total',cx,cy+16);
  ctx.textAlign='left';
}

function autoVerdict(){
  const l=$('#s-l').value,r=$('#s-r').value;
  const v=$('#s-verdict');
  if(l==='RETEST'||r==='RETEST')v.value='RETEST';
  else if(l==='REFER'||r==='REFER')v.value='REFER';
  else v.value='PASS';
}
function saveScreening(e,id){
  e.preventDefault();
  const data={patientId:id?scById(id).patientId:$('#selPatient').value,date:$('#s-date').value,operator:$('#s-op').value.trim(),earLeft:$('#s-l').value,earRight:$('#s-r').value,snrLeft:$('#s-sl').value?+$('#s-sl').value:null,snrRight:$('#s-sr').value?+$('#s-sr').value:null,verdict:$('#s-verdict').value,followUp:$('#s-fu').value,status:$('#s-status').value,note:$('#s-note').value.trim()};
  if(!data.patientId){toast('Please select a patient','err');return}

}

  const m=pg?pById(pg.patientId):null;
  openModal(`
  <div class="modal-head"><h3>${pg?'Edit':'Register'} Pregnancy</h3><button class="ta" onclick="closeModal()">${I.x}</button></div>
  <form onsubmit="savePregnancy(event,'${pid||''}')">
  <div class="modal-body">
    <div class="form-grid">
      <div class="field full"><span>Mother</span>${pg?`<input class="ro" value="${esc(m?m.name:'—')}" readonly>`:selectPatients()}</div>
      <div class="field"><span>LMP (last menstrual period)</span><input id="p-lmp" type="date" value="${pg?pg.lmp:''}" max="${today()}" required oninput="computeEDD()"></div>
      <div class="field"><span>EDD (auto)</span><input id="p-edd" type="date" class="ro" value="${pg?pg.edd:''}" readonly><span class="hint">280 days from LMP (Naegele)</span></div>
      <div class="field"><span>Gravida</span><input id="p-g" type="number" min="1" value="${pg?pg.gravida:1}"></div>
      <div class="field"><span>Para</span><input id="p-p" type="number" min="0" value="${pg?pg.para:0}"></div>
      <div class="field"><span>Abortions</span><input id="p-a" type="number" min="0" value="${pg?pg.ab:0}"></div>
      <div class="field"><span>Live births</span><input id="p-l" type="number" min="0" value="${pg?pg.live:0}"></div>
      <div class="field"><span>Blood Group</span><select id="p-blood"><option></option>${['O+','O-','A+','A-','B+','B-','AB+','AB-'].map(b=>`<option ${pg&&pg.blood===b?'selected':''}>${b}</option>`).join('')}</select></div>
      <div class="field"><span>Latest BP</span><input id="p-bp" value="${pg?pg.bp:''}" placeholder="120/80"></div>
      <div class="field"><span>Weight (kg)</span><input id="p-w" type="number" step="0.1" value="${pg?pg.weight:''}"></div>
      <div class="field"><span>Fetal Heart Rate</span><input id="p-fhr" type="number" value="${pg?pg.fhr:''}" placeholder="120–160"></div>
      <div class="field"><span>Fundal Height (cm)</span><input id="p-fh" type="number" step="0.5" value="${pg?pg.fundal:''}"></div>
      <div class="field"><span>TT (Td) Doses Given</span><input id="p-tt" type="number" min="0" max="2" value="${pg?pg.ttDose:0}"></div>
      <div class="field"><span>Risk Level</span><select id="p-risk"><option ${pg&&pg.risk==='Low'?'selected':''}>Low</option><option ${pg&&pg.risk==='Medium'?'selected':''}>Medium</option><option ${pg&&pg.risk==='High'?'selected':''}>High</option></select></div>
      <div class="field full"><span>Complications / Notes</span><textarea id="p-comp" rows="2">${pg?esc(pg.complication):''}</textarea></div>
    </div>
  </div>
  <div class="modal-foot"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary">${I.check} Save</button></div>
  </form>`);
}
function computeEDD(){const lmp=$('#p-lmp').value;if(lmp){const d=new Date(lmp+'T12:00:00');d.setDate(d.getDate()+280);$('#p-edd').value=iso(d)}}
function savePregnancy(e,pid){
  e.preventDefault();
  const lmp=$('#p-lmp').value,edd=$('#p-edd').value;
  const data={patientId:pid?pgById(pid).patientId:$('#selPatient').value,lmp,edd,gravida:+$('#p-g').value||1,para:+$('#p-p').value||0,ab:+$('#p-a').value||0,live:+$('#p-l').value||0,blood:$('#p-blood').value,bp:$('#p-bp').value.trim(),weight:$('#p-w').value,fhr:$('#p-fhr').value,fundal:$('#p-fh').value,ttDose:+$('#p-tt').value||0,risk:$('#p-risk').value,complication:$('#p-comp').value.trim()};
  if(!data.patientId){toast('Select a mother','err');return}
  if(data.risk==='High'&&!data.complication)data.complication='High risk — escalated';
  if(pid){Object.assign(pgById(pid),data);toast('Pregnancy updated','ok')}
  else{DB.pregnancies.push(Object.assign({id:nextId('pregnancies'),visits:[]},data));addNotif({t:'Pregnancy registered',m:`EDD ${fmtDate(edd)} · Risk ${data.risk}`,c:data.risk==='High'?'danger':'success'})}
  if(data.risk==='High')addNotif({t:'High-risk flag',m:'Review BP & plan referral.',c:'danger'});
  save();closeModal();renderPrenatal();
}
function viewPregnancy(pid){
  const pg=pgById(pid),m=pById(pid);
  const g=gaFromLmp(pg.lmp);
  const rds=pg.risk==='High'?['Isoimmunisation / Rh typing','Blood sugar test','BP monitoring daily','USG + fetal well-being','Dietary + rest counselling']:pg.risk==='Medium'?['Hb repeat in 4 weeks','Diet & IFA compliance','Watch for swelling']:['Routine ANC — next visit in 4 weeks'];
  openModal(`
  <div class="modal-head"><h3>Pregnancy Care Plan</h3><button class="ta" onclick="closeModal()">${I.x}</button></div>
  <div class="modal-body">
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">${patientRow(m||{name:'—'},`G${pg.gravida}P${pg.para}`)}<span class="risk-tag ${riskClass(pg.risk)}">${pg.risk} RISK</span><div style="margin-left:auto;text-align:right"><div style="font-weight:700">${fmtDate(pg.edd)}</div><div class="k" style="color:var(--muted)">EDD</div></div></div>
    <div class="grid g4" style="margin-bottom:16px">
      <div class="kpi card"><div class="n">${gaOfPreg(pg)}</div><div class="k">Gestational age</div></div>
      <div class="kpi card"><div class="n">${g?g.trimester:'—'}</div><div class="k">Trimester</div></div>
      <div class="kpi card"><div class="n">${pg.fhr||'—'}</div><div class="k">Fetal HR (bpm)</div></div>
      <div class="kpi card"><div class="n">${pg.fundal||'—'}</div><div class="k">Fundal ht (cm)</div></div>
    </div>
    <div class="grid g2" style="margin-bottom:16px">
      <div class="kpi card"><div class="n" style="font-size:17px">${pg.bp||'—'}</div><div class="k">Blood Pressure</div></div>
      <div class="kpi card"><div class="n">${pg.ttDose}/2</div><div class="k">Td (tetanus) doses</div></div>
    </div>
    ${pg.complication?`<div class="alert rose" style="margin-bottom:16px">${I.alert}<div><b>Complication</b>${esc(pg.complication)}</div></div>`:''}
    <h4 style="font-size:13px;margin-bottom:8px">Recommended plan this visit</h4>
    ${rds.map(r=>`<div style="display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #f1f5f9">${I.check}<span style="color:var(--success)"></span><span>${r}</span></div>`).join('')}
    <div class="alert info" style="margin-top:14px">${I.bell}<div><b>Reminder</b>Link newborn to hearing screening at delivery point — and auto-attach any REFER to the 6/10/14-week immunisation visits.</div></div>
  </div>`);
}

/* ============================= IMMUNIZATION ============================= */
function renderImmunization(){
  const all=DB.immunizations;
  const given=all.filter(v=>v.status==='Given').length;
  const due=all.filter(v=>v.status==='Due').length;
  const overdue=all.filter(v=>v.status==='Overdue').length;
  const list=[...all].sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));
  $('#content').innerHTML=`
  <div class="page-head">
    <div><h1>Immunization</h1><p>Universal Immunisation Programme (UIP) + IAP schedule · TT for mothers</p></div>
    <div class="head-actions"><button class="btn btn-primary" onclick="openImmunization()">${I.plus} Log Dose</button></div>
  </div>
  <div class="grid g4" style="margin-bottom:16px">
    <div class="card stat"><div class="ic teal">${I.syringe}</div><div><div class="v">${given}</div><div class="l">Doses Given</div></div></div>
    <div class="card stat"><div class="ic amber">${I.cal}</div><div><div class="v">${due}</div><div class="l">Due</div></div></div>
    <div class="card stat"><div class="ic rose">${I.alert}</div><div><div class="v">${overdue}</div><div class="l">Overdue</div><div class="t">contact family</div></div></div>
    <div class="card stat"><div class="ic blue">${I.check}</div><div><div class="v">${all.length?Math.round(given/all.length*100):0}%</div><div class="l">Coverage</div></div></div>
  </div>
  <div class="card">
    <div class="card-head"><div><h3>Vaccination Records</h3><div class="sub">Sorted by due date</div></div></div>
    <div class="table-wrap"><table>
    <thead><tr><th>Patient</th><th>Vaccine</th><th>Dose</th><th>Due Date</th><th>Given Date</th><th>Status</th><th>Site</th><th></th></tr></thead>
    <tbody>${list.map(v=>{const p=pById(v.patientId);const days=v.dueDate?daysBetween(today(),v.dueDate):null;return `<tr>
      <td>${patientRow(p||{name:'—'},ageBadge(v.patientId))}</td>
      <td><b>${esc(v.vaccine)}</b></td>
      <td>${v.dose}</td>
      <td>${v.dueDate?fmtDate(v.dueDate):'—'}${days!=null&&days<0&&v.status!=='Given'?`<div style="font-size:11px;color:var(--danger)">${-days}d overdue</div>`:''}</td>
      <td>${v.date?fmtDate(v.date):'—'}</td>
      <td>${statusBadge(v.status)}</td>
      <td>${esc(v.site||'—')}</td>
      <td class="tbl-actions"><button class="ta" onclick="markGiven('${v.id}')" title="Mark given">${I.check}</button><button class="ta danger" onclick="delImmunization('${v.id}')">${I.trash}</button></td></tr>`}).join('')}
    </tbody></table></div>
  </div>`;
}
function openImmunization(){
  openModal(`
  <div class="modal-head"><h3>Log Vaccination</h3><button class="ta" onclick="closeModal()">${I.x}</button></div>
  <form onsubmit="saveImmunization(event)">
  <div class="modal-body">
    <div class="form-grid">
      <div class="field full"><span>Patient</span>${selectPatients()}</div>
      <div class="field"><span>Vaccine</span><input id="v-name" list="vacList" required placeholder="e.g. Pentavalent 1 + OPV 1"><datalist id="vacList">${['BCG','OPV 0 + HepB 0','Pentavalent 1 + OPV 1','Pentavalent 2 + OPV 2','Pentavalent 3 + OPV 3 + IPV','MR 1 (9 months)','Vitamin A (9 months)','JE-1 (9 months)','DPT Booster 1 + OPV Booster','MR 2 (16-24 months)','DPT Booster 2 (5 years)','Td (10 & 16 years)','Td 1 (Tetanus — mother)','Td 2 (Tetanus — mother)','HepB 3'].map(v=>`<option value="${v}">`).join('')}</datalist></div>

      <div class="field"><span>Injection Site</span><select id="v-site"><option>Left arm</option><option>Right arm</option><option>Left thigh</option><option>Right thigh</option><option>Oral</option></select></div>
      <div class="field"><span>Status</span><select id="v-status"><option>Given</option><option>Due</option><option>Overdue</option></select></div>
    </div>
  </div>
  <div class="modal-foot"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary">${I.check} Save</button></div>

function saveImmunization(e){
  e.preventDefault();
  const pid=$('#selPatient').value;
  if(!pid){toast('Select a patient','err');return}
  DB.immunizations.push({id:nextId('immunizations'),patientId:pid,vaccine:$('#v-name').value.trim(),dose:+$('#v-dose').value||1,dueDate:$('#v-due').value,date:$('#v-date').value,status:$('#v-status').value,site:$('#v-site').value});
  save();closeModal();toast('Vaccination logged','ok');renderImmunization();
}
function markGiven(id){
  const v=DB.immunizations.find(x=>x.id===id);
  v.status='Given';v.date=today();v.site=v.site||'Left arm';
  save();toast('Marked as given','ok');renderImmunization();
}
function delImmunization(id){DB.immunizations=DB.immunizations.filter(v=>v.id!==id);save();renderImmunization()}

function saveAppointment(e){

function completeAppt(id){const a=DB.appointments.find(x=>x.id===id);a.status='Completed';save();renderAppointments()}

function saveRx(e){
  e.preventDefault();
  const pid=$('#selPatient').value;if(!pid){toast('Select a patient','err');return}
  const meds=[];
  if($('#r-m1').value.trim())meds.push({name:$('#r-m1').value.trim(),dose:$('#r-d1').value.trim(),freq:$('#r-f1').value.trim(),dur:$('#r-u1').value.trim()});
  if($('#r-m2').value.trim())meds.push({name:$('#r-m2').value.trim(),dose:$('#r-d2').value.trim(),freq:$('#r-f2').value.trim(),dur:$('#r-u2').value.trim()});
  DB.prescriptions.push({id:nextId('prescriptions'),patientId:pid,doctor:$('#r-doc').value.trim(),date:$('#r-date').value,medicines:meds,notes:$('#r-notes').value.trim()});
  save();closeModal();toast('Prescription saved','ok');renderPrescriptions();
}
function printRx(id){

  const w=window.open('','_blank');
  w.document.write(`<html><head><title>Prescription</title><style>body{font-family:Segoe UI,sans-serif;padding:40px;color:#0f172a}hr{border:none;border-top:1px solid #e2e8f0;margin:14px 0}.med{padding:8px 0;border-bottom:1px solid #f1f5f9}table{width:100%;font-size:14px}</style></head><body>
    <div style="display:flex;justify-content:space-between;align-items:center"><h1 style="color:#0d9488;margin:0">SHRUTI Care</h1><div style="text-align:right;color:#64748b;font-size:13px">${esc(r.doctor)}<br>${fmtDate(r.date)}</div></div><hr>
    <p><b>Patient:</b> ${esc(p?p.name:'—')} · ${esc(p?p.phone:'')} ${p&&p.dob?'· '+ageFromDob(p.dob):''}</p>
    ${r.medicines.map(m=>`<div class="med"><b>${esc(m.name)}</b><div>Dose: ${esc(m.dose)} &nbsp; Freq: ${esc(m.freq)} &nbsp; Duration: ${esc(m.dur)}</div></div>`).join('')}
    ${r.notes?`<p style="margin-top:16px">${esc(r.notes)}</p>`:''}
    <p style="margin-top:30px;color:#64748b;font-size:12px">Generated by SHRUTI Care · This is a triage/screening support record — not legal medical advice.</p>
  </body></html>`);w.document.close();w.print();
}
function delRx(id){DB.prescriptions=DB.prescriptions.filter(r=>r.id!==id);save();renderPrescriptions()}

function barPlain(id,labels,vals){
  const p=prepCanvas(id);if(!p)return;const{ctx,w,h}=p;
  const pad={l:34,r:10,t:14,b:26};
  const max=Math.max(3,...vals)*1.15;
  ctx.font='10px Segoe UI';ctx.strokeStyle='#e2e8f0';ctx.fillStyle='#94a3b8';
  for(let g=0;g<=4;g++){const v=max*g/4,ys=h-pad.b-(v/max)*(h-pad.t-pad.b);ctx.beginPath();ctx.moveTo(pad.l,ys);ctx.lineTo(w-pad.r,ys);ctx.stroke();ctx.fillText(Math.round(v),4,ys+3)}
  const bw=Math.min(40,(w-pad.l-pad.r)/Math.max(1,labels.length)/1.5);
  labels.forEach((l,i)=>{
    const x0=pad.l+(i+.5)*((w-pad.l-pad.r)/Math.max(1,labels.length));
    ctx.fillStyle='#94a3b8';ctx.fillText(l.slice(0,10),x0-bw/2,h-pad.b+14);
    const hh=(vals[i]/max)*(h-pad.t-pad.b);
    const g=ctx.createLinearGradient(0,h-pad.b-hh,0,h-pad.b);
    g.addColorStop(0,'#0d9488');g.addColorStop(1,'#5eead4');
    ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x0-bw/2,h-pad.b-hh,bw,hh,[4,4,0,0]);ctx.fill();
    ctx.fillStyle='#334155';ctx.fillText(vals[i],x0-4,h-pad.b-hh-3);
  });
}

function calcDue(){
  const lmp=$('#t-lmp').value;if(!lmp)return;
  const d=new Date(lmp+'T12:00:00');const e=new Date(d);e.setDate(e.getDate()+280);
  const g=daysBetween(lmp,today());
  $('#t-edd').textContent=fmtDate(iso(e));
  if(g>=0){$('#t-ga').textContent=`${Math.floor(g/7)}w ${g%7}d`;$('#t-tri').textContent=`Trimester ${g<98?1:g<196?2:3}${g>=280?' — past EDD':''}`}
  else {$('#t-ga').textContent='—';$('#t-tri').textContent='Future LMP'}
}
function calcBMI(){
  const h=+$('#t-h').value,w=+$('#t-w').value;
  if(!h||!w){$('#t-bmi').textContent='—';$('#t-cat').textContent='—';return}
  const bmi=w/((h/100)**2);
  $('#t-bmi').textContent=bmi.toFixed(1);
  $('#t-cat').textContent=bmi<18.5?'Underweight':bmi<25?'Normal':bmi<30?'Overweight':'Obese';
}
function calcSNR(){
  const v=[+$('#t-s1').value,+$('#t-s2').value,+$('#t-s3').value,+$('#t-s4').value].filter(x=>!isNaN(x));
  const n=v.filter(x=>x>=6).length;

  $('#t-snr').parentElement.classList.remove('bg-success','bg-warning','bg-danger');
}
function calcVax(){
  const dob=$('#t-dob').value;const box=$('#t-vax');
  if(!dob){box.innerHTML='<span style="color:var(--muted)">Enter DOB to see next vaccines due.</span>';return}
  const weeks=Math.floor(daysBetween(dob,today())/7);
  const months=Math.floor(daysBetween(dob,today())/30.44);
  let due=[];
  if(weeks<6)due=['BCG','OPV 0 + HepB 0'];
  if(weeks>=6&&weeks<10)due=['Pentavalent 1 + OPV 1'];
  if(weeks>=10&&weeks<14)due=['Pentavalent 2 + OPV 2'];
  if(weeks>=14&&weeks<36)due=['Pentavalent 3 + OPV 3 + IPV'];
  if(weeks>=36&&weeks<40)due=['MR 1 (9 months)','Vitamin A','JE-1'];
  if(months>=16&&months<24)due=['DPT Booster 1 + OPV Booster','MR 2'];
  if(months>=24)due=['DPT Booster 2 (5 years)','Td (10 & 16 years)'];
  box.innerHTML=due.length?`<div class="grid g2">${due.map(d=>`<div class="kpi card"><div class="n" style="font-size:14px">${d}</div><div class="k">due now</div></div>`).join('')}</div>`:'<b>Up to date.</b>';
}

let ws=null;
let wsClientId='';
const API_BASE='';
function connectWebSocket(){
  const proto=location.protocol==='https:'?'wss:':'ws:';
  try{
    ws=new WebSocket(proto+'//'+location.host+'/ws');
    ws.onopen=()=>{document.getElementById('wsStatus').textContent='Connected';document.getElementById('wsStatus').style.color='var(--success)';ws.send(JSON.stringify({type:'ping'}))};
    ws.onclose=()=>{document.getElementById('wsStatus').textContent='Disconnected';document.getElementById('wsStatus').style.color='var(--danger)';setTimeout(connectWebSocket,3000)};
    ws.onerror=()=>{document.getElementById('wsStatus').textContent='Error';document.getElementById('wsStatus').style.color='var(--danger)'};
    ws.onmessage=(e)=>{
      try{const msg=JSON.parse(e.data);handleWSMessage(msg)}catch(err){}
    };
  }catch(e){setTimeout(connectWebSocket,3000)}
}
function handleWSMessage(msg){
  if(msg.type==='connected'){wsClientId=msg.client_id;return}
  if(current==='realtime')handleRealtimeWS(msg);
  if(current==='simulator')handleSimulatorWS(msg);
  if(current==='ai_engine')handleAIWS(msg);
}
function wsSend(data){if(ws&&ws.readyState===1)ws.send(JSON.stringify(data))}

function handleRealtimeWS(msg){
  if(msg.type==='screening_phase'){
    rtPhase=msg.phase;
    if(msg.phase==='probe_fit'){
      document.getElementById('rt-probe-val').textContent=msg.status;
      document.getElementById('rt-probe-t').textContent=msg.seal?'Seal: '+Math.round(msg.seal*100)+'%':'Checking...';
      addRTLog('Probe fit: '+msg.status+(msg.seal?' ('+Math.round(msg.seal*100)+'%)':''),msg.status==='READY'?'ok':'warn');
    }
    if(msg.phase==='ambient_noise'){
      document.getElementById('rt-noise-val').textContent=msg.status;
      document.getElementById('rt-noise-t').textContent=msg.level_db?msg.level_db+' dB':'Checking...';
      addRTLog('Ambient noise: '+msg.status+(msg.level_db?' ('+msg.level_db+' dB)':''),msg.status==='PASS'?'ok':'warn');
    }
    if(msg.phase==='stimulus'){
      const p=msg.progress||0;
      addRTLog('Stimulus delivery at '+msg.frequency+' Hz ('+p+'%)','info');
      document.getElementById('rtProgress').innerHTML=['2k','3k','4k','5k'].map((f,i)=>`<div class="otp-seg ${i<=Math.floor(p/25)?'on':''}"></div>`).join('');
    }
    if(msg.phase==='analysis'){addRTLog('Computing final result...','info')}
  }
  if(msg.type==='screening_fft'){
    rtFFT.push({freq:msg.frequency,data:msg.fft,dpoae:msg.dpoae});
    drawLiveFFT(msg.fft);
    drawLiveDPGram();
    addRTLog('DPOAE @ '+msg.frequency+' Hz: SNR '+msg.dpoae.snr+' dB '+(msg.dpoae.is_present?'[PASS]':'[FAIL]'),msg.dpoae.is_present?'ok':'err');
  }
  if(msg.type==='screening_quality'){

function drawDefaultDPGram(){const c=document.getElementById('rtDPGramCanvas');if(!c)return;const ctx=c.getContext('2d');ctx.fillStyle='#0a0f1a';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#475569';ctx.font='13px Segoe UI';ctx.textAlign='center';ctx.fillText('Start screening to see DP-Gram',c.width/2,c.height/2);ctx.textAlign='left'}
function drawLiveFFT(fftData){
  const c=document.getElementById('rtFFTCanvas');if(!c)return;const ctx=c.getContext('2d');
  ctx.fillStyle='#0a0f1a';ctx.fillRect(0,0,c.width,c.height);
  if(!fftData||!fftData.length)return;
  const w=c.width,h=c.height,pad={l:50,r:20,t:20,b:30};
  ctx.strokeStyle='#1e293b';ctx.lineWidth=0.5;
  for(let i=0;i<=5;i++){const y=pad.t+(i/5)*(h-pad.t-pad.b);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke()}
  ctx.strokeStyle='#94a3b8';ctx.font='10px Segoe UI';ctx.fillStyle='#64748b';
  const maxF=fftData[fftData.length-1].f||8000;
  [0,2000,4000,6000,8000].forEach(f=>{const x=pad.l+(f/maxF)*(w-pad.l-pad.r);ctx.fillText(f/1000+'k',x-8,h-pad.b+14)});
  [-80,-60,-40,-20,0].forEach((db,i)=>{const y=pad.t+(i/4)*(h-pad.t-pad.b);ctx.fillText(db+'',6,y+3)});
  ctx.beginPath();ctx.strokeStyle='#0d9488';ctx.lineWidth=1.5;
  fftData.forEach((p,i)=>{
    const x=pad.l+(p.f/maxF)*(w-pad.l-pad.r);
    const y=pad.t+((-80-Math.max(-80,Math.min(0,p.m)))/80)*(h-pad.t-pad.b);
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });ctx.stroke();
  const g=ctx.createLinearGradient(0,pad.t,0,h-pad.b);g.addColorStop(0,'#0d948844');g.addColorStop(1,'#0d948800');
  ctx.fillStyle=g;ctx.beginPath();
  fftData.forEach((p,i)=>{const x=pad.l+(p.f/maxF)*(w-pad.l-pad.r);const y=pad.t+((-80-Math.max(-80,Math.min(0,p.m)))/80)*(h-pad.t-pad.b);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});
  ctx.lineTo(pad.l+(fftData[fftData.length-1].f/maxF)*(w-pad.l-pad.r),h-pad.b);ctx.lineTo(pad.l,h-pad.b);ctx.closePath();ctx.fill();
}
function drawLiveDPGram(){
  const c=document.getElementById('rtDPGramCanvas');if(!c)return;const ctx=c.getContext('2d');
  ctx.fillStyle='#0a0f1a';ctx.fillRect(0,0,c.width,c.height);
  if(!rtFFT.length)return;
  const w=c.width,h=c.height,pad={l:50,r:20,t:20,b:30};
  ctx.strokeStyle='#1e293b';ctx.lineWidth=0.5;
  for(let i=0;i<=5;i++){const y=pad.t+(i/5)*(h-pad.t-pad.b);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke()}
  ctx.fillStyle='#64748b';ctx.font='10px Segoe UI';
  [2000,3000,4000,5000].forEach((f,i)=>{const x=pad.l+((i+0.5)/4)*(w-pad.l-pad.r);ctx.fillText(f/1000+'k',x-8,h-pad.b+14)});
  [-40,-30,-20,-10,0].forEach((db,i)=>{const y=pad.t+(i/4)*(h-pad.t-pad.b);ctx.fillText(db+'',6,y+3)});
  rtFFT.forEach((entry,i)=>{
    const x=pad.l+((i+0.5)/4)*(w-pad.l-pad.r);
    const snr=entry.dpoae?entry.dpoae.snr:0;
    const barH=Math.max(4,Math.abs(snr)/40*(h-pad.t-pad.b));
    const col=snr>=6?'#16a34a':snr>=3?'#d97706':'#e11d48';
    ctx.fillStyle=col;ctx.globalAlpha=0.8;
    ctx.fillRect(x-16,h-pad.b-barH,32,barH);ctx.globalAlpha=1;
    ctx.fillStyle='#fff';ctx.font='bold 11px Segoe UI';ctx.textAlign='center';ctx.fillText(Math.round(snr)+'dB',x,h-pad.b-barH-6);ctx.textAlign='left';
    ctx.fillStyle='#fff';ctx.font='10px Segoe UI';ctx.textAlign='center';ctx.fillText(entry.dpoae&&entry.dpoae.is_present?'PASS':'FAIL',x,h-pad.b-barH-18);ctx.textAlign='left';
  });
}

          <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9"><span style="font-size:13px">Calibration</span><span class="badge ${d.calibration_valid?'bg-success':'bg-danger'}">${d.calibration_valid?'Valid':'Expired'}</span><span style="font-size:12px;color:var(--muted)">${fmtDate(d.calibration_date)}</span></div>
          <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9"><span style="font-size:13px">Storage</span><div class="progress" style="flex:1"><i style="width:${Math.round(d.storage_used/d.storage_total*100)}%"></i></div><span style="font-size:12px">${d.storage_used}/${d.storage_total} GB</span></div>
          <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9"><span style="font-size:13px">Last Self-Test</span><span style="font-size:12px;color:var(--muted)">${fmtDate(d.last_self_test)}</span></div>
        </div>
        <button class="btn btn-primary" style="margin-top:14px" onclick="runSelfTest('${esc(d.serial)}')">Run Self-Test</button>
        <div id="selfTestResult" style="margin-top:14px"></div>
      </div>
    </div>`).join('')}`;
  }).catch(()=>{$('#content').innerHTML='<div class="empty"><p>Connect to backend to view devices.</p></div>'});
}
function runSelfTest(serial){
  fetch(API_BASE+'/api/devices/'+serial+'/self-test').then(r=>r.json()).then(r=>{
    const tests=Object.entries(r.tests);
    document.getElementById('selfTestResult').innerHTML=`
    <div class="alert ${r.overall==='READY'?'teal':'warn'}">${I.check}<div><b>Self-Test: ${r.overall}</b><div style="margin-top:8px">${tests.map(([k,v])=>`<span class="badge ${v.status==='PASS'?'bg-success':'bg-warning'}" style="margin:2px">${k}: ${v.status}</span>`).join(' ')}</div></div></div>`;
  });
}

function renderParentInfo(){
  fetch(API_BASE+'/api/parent/info/en').then(r=>r.json()).then(data=>{
    $('#content').innerHTML=`
    <div class="page-head"><div><h1>Parent-Facing Module</h1><p>Simple explanations of screening results in regional languages with voice guidance</p></div></div>
    <div class="tabs" style="margin-bottom:16px"><button class="tab active" onclick="loadParentLang('en',this)">English</button><button class="tab" onclick="loadParentLang('hi',this)">Hindi</button></div>
    <div class="grid g3" style="margin-bottom:16px">
      <div class="card" style="border-left:4px solid var(--success)"><div class="card-pad"><h3 style="color:var(--success);font-size:14px;margin-bottom:8px">PASS</h3><p style="font-size:13px">${esc(data.pass_explain)}</p></div></div>
      <div class="card" style="border-left:4px solid var(--danger)"><div class="card-pad"><h3 style="color:var(--danger);font-size:14px;margin-bottom:8px">REFER</h3><p style="font-size:13px">${esc(data.refer_explain)}</p></div></div>
      <div class="card" style="border-left:4px solid var(--warning)"><div class="card-pad"><h3 style="color:var(--warning);font-size:14px;margin-bottom:8px">RETEST</h3><p style="font-size:13px">${esc(data.retest_explain)}</p></div></div>
    </div>
    <div class="card"><div class="card-head"><h3>Education</h3></div><div class="card-pad"><p style="font-size:13px">${esc(data.education)}</p></div></div>`;
  }).catch(()=>{$('#content').innerHTML='<div class="empty"><p>Connect to backend for parent module.</p></div>'});
}
function loadParentLang(lang,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');
  fetch(API_BASE+'/api/parent/info/'+lang).then(r=>r.json()).then(data=>{
    document.querySelectorAll('.card h3').forEach(h=>{
      if(h.textContent==='PASS')h.nextElementSibling.textContent=data.pass_explain;
      if(h.textContent==='REFER')h.nextElementSibling.textContent=data.refer_explain;
      if(h.textContent==='RETEST')h.nextElementSibling.textContent=data.retest_explain;
    });
  });
}

/* ============================= ROUTER ============================= */
function renderView(){
  const map={dash:renderDash,patients:renderPatients,screening:renderScreening,prenatal:renderPrenatal,immunization:renderImmunization,appointments:renderAppointments,prescriptions:renderPrescriptions,labs:renderLabs,vitals:renderVitals,pharmacy:renderPharmacy,billing:renderBilling,staff:renderStaff,reports:renderReports,tools:renderTools,realtime:renderRealtime,simulator:renderSimulator,dpoae_viz:renderDPOAEViz,ai_engine:renderAIEngine,devices:renderDevices,passport:renderPassport,referrals:renderReferrals,prenatal_res:renderPrenatalRes,explainable:renderExplainable,parent_info:renderParentInfo};
  if(map[current])map[current]();
  updateNav();renderBell();
}

/* ============================= INIT ============================= */
seed();
const VIEW_KEYS={dash:1,patients:1,screening:1,prenatal:1,immunization:1,appointments:1,prescriptions:1,labs:1,vitals:1,pharmacy:1,billing:1,staff:1,reports:1,tools:1,realtime:1,simulator:1,dpoae_viz:1,ai_engine:1,devices:1,passport:1,referrals:1,prenatal_res:1,explainable:1,parent_info:1};
const _h=(location.hash||'').replace('#','');
if(VIEW_KEYS[_h])current=_h;
window.addEventListener('hashchange',()=>{const h=(location.hash||'').replace('#','');if(VIEW_KEYS[h]){current=h;renderView()}});
renderNav();
renderView();
connectWebSocket();
</script>
